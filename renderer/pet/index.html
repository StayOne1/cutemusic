<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>蕾姆 - CuteMusic</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="pet-container" class="pet-container">
    <div id="pet-body" class="pet-body">
      <div id="pet-character" class="pet-character rem-idle">
        <div class="rem-image">
          <img src="../assets/rem.jpg" alt="蕾姆">
        </div>
      </div>
      <div id="track-tooltip" class="track-tooltip hidden">
        <span id="tooltip-text"></span>
      </div>
      <div class="music-notes">
        <span class="note n1">♪</span>
        <span class="note n2">♫</span>
        <span class="note n3">♪</span>
      </div>
    </div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
